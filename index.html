<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>切克斯穿搭圖鑑 Widget</title>
  <style>
    :root {
      --bg-card: rgba(255, 255, 255, 0.75);
      --bg-tag: rgba(255, 255, 255, 0.95);
      --border-color: rgba(255, 255, 255, 0.5);
      --text-main: #222222;
      --text-sub: #555555;
    }

    /* Notion 深色模式適應 */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-card: rgba(30, 30, 30, 0.75);
        --bg-tag: rgba(45, 45, 45, 0.95);
        --border-color: rgba(255, 255, 255, 0.15);
        --text-main: #f0f0f0;
        --text-sub: #cccccc;
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .widget-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* 頂部工具列：進度條與音效按鈕 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 240px;
      margin-bottom: 6px;
      z-index: 20;
    }

    .progress-tag {
      background: var(--bg-tag);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sub);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      letter-spacing: 0.5px;
    }

    .sound-btn {
      background: var(--bg-tag);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s;
    }
    .sound-btn:hover { transform: scale(1.1); }

    /* 角色舞台區域 */
    .character-stage {
      position: relative;
      width: 240px;
    }

    /* 底座陰影光圈 */
    .stage-shadow {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 16px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      z-index: 0;
      pointer-events: none;
    }

    .base-character {
      width: 100%;
      height: auto;
      object-fit: contain;
      z-index: 1;
      pointer-events: none;
      display: block;
    }

    .accessory {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: auto;
      object-fit: contain;
      z-index: 2;
      pointer-events: none;
      filter: grayscale(100%) brightness(0.4) opacity(0.65);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: block;
    }

    /* 鼠標懸停熱區時的亮邊反饋 */
    .accessory.hovered {
      filter: grayscale(40%) brightness(0.85) opacity(0.9) drop-shadow(0px 0px 6px rgba(255, 255, 255, 0.8));
      transform: scale(1.02);
      z-index: 4;
    }

    /* Active 選中狀態 */
    .accessory.active {
      filter: grayscale(0%) brightness(1) opacity
